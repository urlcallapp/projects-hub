<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects Hub</title>
<meta name="description" content="All of urlcallapp's repos in one place — GitHub and live-site links, with search and filters.">
<meta property="og:title" content="Projects Hub">
<meta property="og:description" content="All of urlcallapp's repos in one place — GitHub and live-site links.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <a class="lang-switch" href="he/" hreflang="he" aria-label="Switch to Hebrew">עברית</a>
  <div class="hero-inner">
    <h1><span class="hero-emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span> Projects Hub</h1>
    <p class="subtitle">All the repos in one place — code links and live sites</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="container">
  <div class="controls">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="search" placeholder="Search projects…" aria-label="Search projects">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by tag"></div>
  </div>

  <p class="result-count" id="result-count" aria-live="polite"></p>

  <section class="grid" id="grid"></section>

  <p class="empty" id="empty" hidden>
    <span class="empty-emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><br>
    No projects match your search.
    <button class="clear-btn" id="clear-filters">Clear filters</button>
  </p>
</main>

<footer class="footer">
  <a href="https://github.com/urlcallapp" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    github.com/urlcallapp
  </a>
</footer>

<script src="i18n-en.js"></script>
<script src="projects.js"></script>
<script src="app.js"></script>
</body>
</html>
